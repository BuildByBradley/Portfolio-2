  <header class="project-hero relative w-full h-[60vh] lg:h-screen">
      <div class="hero-canvas-container" style="height: 100vh; position: relative;">
          <canvas id="project-hero-canvas" style="width:100%; height:100%; object-fit:cover; opacity: 0.8;"></canvas>
          <script>
              document.addEventListener("DOMContentLoaded", () => {
                  if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
                      gsap.registerPlugin(ScrollTrigger);
                  } else {
                      console.warn("GSAP or ScrollTrigger not loaded");
                      return;
                  }

                  const canvas = document.getElementById('project-hero-canvas');
                  if (!canvas) return;
                  const ctx = canvas.getContext('2d', { alpha: false });
                  canvas.width = 1920;
                  canvas.height = 1080;

                  const totalFrames = 1081;
                  const images = [];

                  const getFramePath = (index) => {
                      return `../../assets/projects/site-intelligence/hero-sequence/frame_${String(index).padStart(4, '0')}.webp`;
                  };

                  // Preload all frames
                  for (let i = 1; i <= totalFrames; i++) {
                      const img = new Image();
                      img.src = getFramePath(i);
                      images.push(img);
                  }

                  images[0].onload = () => {
                      ctx.drawImage(images[0], 0, 0, canvas.width, canvas.height);
                  };

                  ScrollTrigger.create({
                      trigger: '.project-hero',
                      start: 'top top',
                      end: '+=45000',
                      pin: true,
                      scrub: 0.1,
                      onUpdate: (self) => {
                          const frameIndex = Math.min(
                              totalFrames - 1,
                              Math.floor(self.progress * totalFrames)
                          );
                          const img = images[frameIndex];
                          if (img && img.complete) {
                              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                          }
                      }
                  });

                  // Text Entrance Animation
                  gsap.from(".hero-text-anim", {
                      y: 40,
                      opacity: 0,
                      duration: 1.5,
                      stagger: 0.15,
                      ease: "power3.out",
                      delay: 0.1
                  });
              });
          </script>
