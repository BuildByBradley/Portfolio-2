<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV — Bradley Brits</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root { --void:#0a0a0a; --gold:#C8A96E; --gold-border:rgba(200,169,110,0.25); --text:#f5f5f5; --text-muted:#888; --ff-body:'Inter',sans-serif; --ff-mono:'JetBrains Mono',monospace; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--void); color:var(--text); font-family:var(--ff-body); min-height:100vh; display:flex; flex-direction:column; }
    nav { padding:1.5rem 2rem; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.06); }
    .back-link { font-family:var(--ff-mono); font-size:0.65rem; letter-spacing:0.15em; color:var(--gold); text-decoration:none; text-transform:uppercase; }
    .download-btn { font-family:var(--ff-mono); font-size:0.65rem; letter-spacing:0.12em; text-transform:uppercase; padding:0.6rem 1.4rem; border:1px solid var(--gold-border); color:var(--gold); text-decoration:none; transition:all 0.3s; }
    .download-btn:hover { background:var(--gold); color:#000; }
    .contact-bar { padding:1.5rem 2rem; display:flex; gap:2rem; border-bottom:1px solid rgba(255,255,255,0.06); }
    .contact-item { font-size:0.8rem; color:var(--text-muted); }
    .contact-item a { color:var(--gold); text-decoration:none; }
    .pdf-wrapper { flex:1; width:100%; }
    iframe { display:block; width:100%; height:calc(100vh - 120px); border:none; }
  </style>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3PV9G8CCTQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3PV9G8CCTQ');
  </script>
</head>
<body>
  <nav>
    <a href="../index.html" class="back-link" target="_top">← Back to Portfolio</a>
    <a href="bradley-brits-cv.pdf" download class="download-btn">Download CV ↓</a>
  </nav>
  <div class="contact-bar">
    <span class="contact-item">Email: <a href="mailto:ibradleyqbrits@gmail.com">ibradleyqbrits@gmail.com</a></span>
    <span class="contact-item">Phone: <a href="tel:+27786618090">078 661 8090</a></span>
  </div>

  <!-- Contact Capture -->
  <div class="contact-bar" style="border-top: none; padding-top: 0;">
    <div data-fs-success style="font-family:var(--ff-mono); font-size:0.65rem; letter-spacing:0.15em; color:var(--gold); text-transform:uppercase; display:none;">Message received — I'll be in touch.</div>
    <div data-fs-error style="font-family:var(--ff-mono); font-size:0.65rem; color:#ff6b6b; display:none;"></div>
    <form id="contact-form" style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
      <input
        type="text"
        name="name"
        placeholder="Your Name"
        data-fs-field
        required
        style="background:none; border:none; border-bottom:1px solid var(--gold-border); color:var(--text); font-family:var(--ff-body); font-size:0.8rem; padding:0.4rem 0; outline:none; min-width:160px; color:var(--text-muted);"
      />
      <input
        type="email"
        name="email"
        placeholder="Your Email"
        data-fs-field
        required
        style="background:none; border:none; border-bottom:1px solid var(--gold-border); color:var(--text); font-family:var(--ff-body); font-size:0.8rem; padding:0.4rem 0; outline:none; min-width:160px; color:var(--text-muted);"
      />
      <input
        type="text"
        name="message"
        placeholder="Add a message..."
        data-fs-field
        style="background:none; border:none; border-bottom:1px solid var(--gold-border); color:var(--text); font-family:var(--ff-body); font-size:0.8rem; padding:0.4rem 0; outline:none; min-width:240px; flex: 1; color:var(--text-muted);"
      />
      <button
        type="submit"
        data-fs-submit-btn
        style="font-family:var(--ff-mono); font-size:0.65rem; letter-spacing:0.12em; text-transform:uppercase; padding:0.4rem 1rem; border:1px solid var(--gold-border); color:var(--gold); background:none; cursor:pointer; transition:all 0.3s;"
        onmouseover="this.style.background='var(--gold)';this.style.color='#000';"
        onmouseout="this.style.background='none';this.style.color='var(--gold)';"
      >Leave Details ↗</button>
    </form>
  </div>

  <script>
    window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
    formspree('initForm', { formElement: '#contact-form', formId: 'xjgqoqvp' });
  </script>
  <script src="https://unpkg.com/@formspree/ajax@1" defer></script>

  <div class="pdf-wrapper">
    <iframe src="bradley-brits-cv.pdf" type="application/pdf"></iframe>
  </div>
</body>
</html>
